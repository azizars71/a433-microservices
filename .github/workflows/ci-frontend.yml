name: CI Frontend

on:
  push:
    branches: ['karsajobs-ui']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Build Docker Image
        run: docker build -t ghcr.io/azizars71/karsajobs-ui:latest .

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u azizars71 --password-stdin

      - name: Push Docker Image
        run: docker push ghcr.io/azizars71/karsajobs-ui:latest
