name: CI Backend # nama action

# push ke karsajobs (backend)
on:
  push:
    branches: ['karsajobs']

jobs: # apa saja yang akan dilaksanakan
  build:
    runs-on: ubuntu-latest # menggunakan ubuntu latest
    steps:
      # checkout source untuk mengambil code dari repo
      - name: checkout-source
        uses: actions/checkout@v3

      # setup golang versi 1.15 sesuai kebutuhan app
      - name: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: 1.15

      # linting berkas dockerfile menggunakan hadolint
      - name: lint-dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      # unit test untuk backend
      - name: test-app
        run: go test -v -short --count=1 $(go list ./...)

      # memberikan izin execute pada shell script build-push backend
      - name: exec-script
        run: chmod +x ./build_push_image_karsajobs.sh

      # menjalankan shell script dengan env yang telah ditentukan
      - name: build-app-karsajobs
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: ./build_push_image_karsajobs.sh
