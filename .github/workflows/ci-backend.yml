name: CI Backend

on:
  push:
    branches: ['karsajobs']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.20

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Run Unit Tests
        run: go test -v -short --count=1 $(go list ./...)

      - name: Build Docker Image
        run: docker build -t ghcr.io/azizars71/karsajobs:latest .

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u azizars71 --password-stdin

      - name: Push Docker Image
        run: docker push ghcr.io/azizars71/karsajobs:latest
